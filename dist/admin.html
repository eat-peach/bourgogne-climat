<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Atlas Submissions</title>
  <style>
    :root{--paper:#f4f0e8;--paper-deep:#ebe4d8;--ink:#28231f;--muted:#766e65;--line:#d7cfc3;--wine:#782536;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    h1{font:400 22px var(--serif);margin:0}
    main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
    button,select,input,textarea{font:inherit}
    button{cursor:pointer;border:1px solid var(--line);background:#fffdf9;color:var(--ink);padding:7px 12px}
    button.primary{background:var(--wine);border-color:var(--wine);color:var(--paper)}
    button.danger{color:#a3262f}
    .login{max-width:420px;margin:60px auto;display:grid;gap:12px}
    .login p{color:var(--muted);margin:0}
    input[type=password],select,textarea{border:1px solid var(--line);background:#fffdf9;padding:8px 10px;width:100%}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .filters select{width:auto}
    .counts{color:var(--muted);font-size:12px}
    .item{background:#fffdf9;border:1px solid var(--line);padding:16px 18px;margin-bottom:12px;display:grid;gap:10px}
    .item-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
    .kind{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine)}
    .title{font:400 18px var(--serif)}
    .meta{font-size:12px;color:var(--muted)}
    .block{white-space:pre-wrap;word-break:break-word;background:var(--paper);padding:10px 12px;border-left:3px solid var(--line)}
    .block b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:normal}
    .photos{display:flex;gap:8px;flex-wrap:wrap}
    .photos a{display:block;width:120px;height:120px;border:1px solid var(--line);background:var(--paper-deep)}
    .photos img{width:100%;height:100%;object-fit:cover;display:block}
    .controls{display:grid;grid-template-columns:160px 1fr auto auto;gap:8px;align-items:start}
    .controls textarea{min-height:38px;resize:vertical}
    .status-new{color:#a3262f}
    .empty,.error{color:var(--muted);text-align:center;padding:40px 0}
    .error{color:#a3262f}
    @media(max-width:640px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Atlas submissions</h1><button id="sign-out" hidden>Sign out</button></header>
  <main>
    <form class="login" id="login" hidden>
      <p>Enter the admin password to review feedback and correction requests.</p>
      <input type="password" id="token" autocomplete="current-password" placeholder="Admin password" required />
      <button class="primary" type="submit">Open</button>
      <p class="error" id="login-error" hidden></p>
    </form>
    <section id="app" hidden>
      <div class="filters">
        <select id="filter-status" aria-label="Status"><option value="new">New</option><option value="reviewing">Reviewing</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="spam">Spam</option><option value="all">All statuses</option></select>
        <select id="filter-kind" aria-label="Type"><option value="all">All types</option><option value="correction">Corrections</option><option value="feedback">Feedback</option></select>
        <button id="refresh" type="button">Refresh</button>
        <span class="counts" id="counts"></span>
      </div>
      <div id="list"></div>
      <button id="more" type="button" hidden>Load more</button>
    </section>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
